# Pinned upstream sources for the Harmonia components. Every sha256 below was
# recorded by downloading the exact
# URL on 2026-10-20 (ffmpeg additionally checked against its PGP signature).
# `fetch` refuses any download whose hash differs. To bump a version: change
# version + url, download, record the new hash, rebuild every platform.
#
# [components.<name>] are what we publish; `deps` lists the [sources.<id>]
# compiled INTO that component — every one of them is copied verbatim into the
# component's source archive (`upstream/`), as the licences require.

[components.ffmpeg]
version = "7.1.5"
license = "LGPL-2.1-or-later"
attribution = "This software uses libraries from the FFmpeg project under the LGPLv2.1"
executables = ["ffmpeg", "ffprobe"]
libraries = []
sources = ["ffmpeg", "lame", "opus", "libogg", "libvorbis"]

[components.rubberband]
version = "4.0.0"
license = "GPL-2.0-or-later"
attribution = "This product uses the Rubber Band Library audio timestretcher from Breakfast Quay"
executables = ["rubberband"]
libraries = []
sources = ["rubberband", "libsndfile"]

[components.taglib]
version = "2.3.2"
license = "LGPL-2.1-only OR MPL-1.1"
attribution = "This software uses the TagLib library (LGPL-2.1 / MPL-1.1)"
executables = []
libraries = ["tag_c"]
sources = ["taglib", "zlib"]

[sources.ffmpeg]
